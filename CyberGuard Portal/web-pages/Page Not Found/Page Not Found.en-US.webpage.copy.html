{% comment %} CyberGuard — 404 {% endcomment %}
<div class="cg">
  <div class="cg-center">
    <div>
      <div class="code">404</div>
      <h1>We can’t find that page</h1>
      <p>It may have moved or the link may be wrong. Try a search, or head to one of these.</p>
      <form action="{{ sitemarkers['Search'].url | default: '/search/' | escape }}" method="get" role="search" style="display:flex;gap:10px;max-width:480px;margin:0 auto 22px">
        <label class="cg-sr" for="nfQ">Search</label>
        <input class="cg-in" id="nfQ" name="q" type="search" placeholder="Search the portal…" style="flex:1">
        <button class="cg-btn primary" type="submit">Search</button>
      </form>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <a class="cg-btn ghost" href="/">Home</a><a class="cg-btn ghost" href="/dashboard/">Dashboard</a><a class="cg-btn ghost" href="/incident-response/">Incident response</a><a class="cg-btn ghost" href="/faq/">FAQ</a>
      </div>
    </div>
  </div>
</div>
