{% comment %} Landasan Digital SOC Portal - page not found {% endcomment %}
<div class="ld">
  <div class="ld-wrap">
    <div class="ld-oops">
      <p class="code">Error 404</p>
      <h1>This page doesn’t exist</h1>
      <p>The link may be old or mistyped. Search for what you need, or go to the home page.</p>
      <form class="ld-searchform" action="{{ sitemarkers['Search'].url | default: '/search/' | escape }}" method="get" role="search">
        <div class="ld-search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="ld-sr" for="nfQ">Search the portal</label>
          <input class="ld-input" id="nfQ" name="q" type="search" placeholder="Search the portal">
        </div>
        <button class="ld-btn primary" type="submit">Search</button>
      </form>
      <div class="ld-actions"><a class="ld-btn" href="/">Go to the home page</a><a class="ld-btn quiet" href="/dashboard/">Dashboard</a><a class="ld-btn quiet" href="/faq/">FAQ</a></div>
    </div>
  </div>
</div>
